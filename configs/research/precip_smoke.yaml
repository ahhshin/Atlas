name: atlas-mini-precip-smoke

start: 2020-01-01
end: 2020-01-31

bbox:
  west: -125
  south: 24
  east: -66
  north: 50

resolution_degrees: 0.25
cadence_hours: 3
context_hours: 24
target_hours: 6
percentile: 0.95
max_storage_gb: 15

# ATLAS_DATA_ROOT overrides this path. required_mount prevents fallback to the system disk.
storage_root: /mnt/games/Atlas/data
required_mount: /mnt/games

source:
  type: earthmover-era5
  bucket: earthmover-icechunk-era5
  prefix: icechunkV2
  region: us-east-1
  branch: main
  group: single/temporal

variables:
  - temperature_2m
  - dewpoint_2m
  - surface_pressure
  - u_wind_10m
  - v_wind_10m
  - total_precipitation
  - total_cloud_cover
  - surface_solar_radiation_downwards
  - soil_moisture_layer_1
  - skin_temperature

splits:
  train:
    start: 2020-01-01
    end: 2020-01-20
  validation:
    start: 2020-01-21
    end: 2020-01-25
  test:
    start: 2020-01-26
    end: 2020-01-31

chunks:
  time: 8
  latitude: 32
  longitude: 32

training:
  random_seed: 2020
  samples_per_time: 64
  max_train_samples: 120000
  max_eval_samples: 60000
  max_replay_times: 32
