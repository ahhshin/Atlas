[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-state"
version = "0.1.0"
description = "A reproducible sandbox for multimodal environmental forecasting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "duckdb>=1.1",
  "httpx>=0.28",
  "numpy>=2.0",
  "pandas>=2.2",
  "plotly>=5.24",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "streamlit>=1.39",
  "xarray>=2024.9",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
world-state-generate = "world_state.synthetic:main"
world-state-ingest = "world_state.ingest.cli:main"
world-state-worker = "world_state.ingest.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/world_state"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
