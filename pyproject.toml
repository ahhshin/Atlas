[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "world-state"
version = "0.1.0"
description = "A reproducible sandbox for multimodal environmental forecasting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.11,<4",
  "cfgrib>=0.9.15",
  "duckdb>=1.1",
  "dask[array]>=2025.1",
  "eccodes>=2.43",
  "httpx>=0.28",
  "h5netcdf>=1.6",
  "h5py>=3.12",
  "icechunk>=2.1,<3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pcodec>=1.0,<2",
  "plotly>=5.24",
  "pyarrow>=17",
  "pyproj>=3.7",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "scikit-learn>=1.6",
  "shapely>=2.0",
  "streamlit>=1.39",
  "xarray>=2024.9",
  "zarr>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]
latent = ["torch>=2.3"]

[project.scripts]
world-state-generate = "world_state.synthetic:main"
world-state-ingest = "world_state.ingest.cli:main"
world-state-worker = "world_state.ingest.worker:main"
atlas-research = "world_state.research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/world_state"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
